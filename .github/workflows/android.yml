name: Android-app bouwen

# Builds the APK and attaches it to the "app-latest" release, so it can be downloaded on a phone without logging in.
on:
  push:
    branches: [main]
    paths: ["app/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bouwen
        run: gradle :app:assembleDebug --no-daemon

      - name: Hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk AIDagelijks.apk

      - name: Release bijwerken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: AI Dagelijks (nieuwste app)
          body: |
            Download **AIDagelijks.apk** op je Android-telefoon en open het bestand om te installeren.
            Build #${{ github.run_number }}.
          files: AIDagelijks.apk
          make_latest: true
